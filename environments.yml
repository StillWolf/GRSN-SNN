name: grsn
# 经实测可跑通 POMDP 全部测试 + MARL 冒烟（CPU）。
# CUDA 训练需自行选 torch CUDA 版本，见 docs/SETUP.md。
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # 核心
    - torch>=2.0,<2.5      # 与 spikingjelly clock_driven API 兼容
    - "numpy<2"            # 老版 gym 不兼容 numpy 2.x
    - scipy>=1.10
    # RL 环境
    - gym==0.26.2          # SMAC / 老 pomdp wrapper 都依赖此版本
    - pybullet>=3.2.5      # PyBullet POMDP 环境
    - pycolab              # KeyToDoor 信用分配环境
    # SNN
    - spikingjelly>=0.0.0.0.14
    # 训练副功能
    - ruamel.yaml>=0.16
    - tqdm
    - matplotlib
    - seaborn
    - pandas
    - tensorboard          # 可选；train.py 不强依赖
    # 测试
    - pytest>=6
